pipeline:
  id: banking_app_pipeline
  name: banking-app-pipeline
  description: Builds and tests the banking-app Java Maven backend on Harness Cloud.
  tags:
    ai_generated: ""
  clone:
    enabled: true
    connector: connector_Github_b6d0
    repo: HamzaZizi/banking-app
    ref:
      type: branch
      name: main
  stages:
    - id: javaMavenBuildTestHostedLinuxStage_1
      name: Java Maven Build and Test on Harness Cloud (Linux)
      cache:
        enabled: true
      build-intelligence:
        enabled: true
      steps:
        - id: setupJava
          name: Setup Java
          template:
            uses: setupJava@1.0.0
        - id: buildLinux
          name: Build on Linux
          run:
            shell: bash
            script: |-
              export JAVA_HOME=/opt/harness/tools/java/current
              export PATH="$JAVA_HOME/bin:$PATH"
              java -version
              cd backend
              mvn -B -DskipTests package
        - id: testLinux
          name: Test on Linux
          run-test:
            shell: bash
            script: |-
              set -eu
              export JAVA_HOME=/opt/harness/tools/java/current
              export PATH="$JAVA_HOME/bin:$PATH"
              cd backend
              mvn -B test -Dmaven.build.cache.skipCache=true
              mvn -B jacoco:report || echo "JaCoCo is not configured; skipping coverage report generation."
            intelligence:
              disabled: true
        - id: coverage
          name: Upload Coverage
          run:
            shell: bash
            script: |-
              cd backend
              hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
